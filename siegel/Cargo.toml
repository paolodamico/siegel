[package]
name = "siegel"
description = "Protected memory management for one-time use secrets."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "siegel"

[features]
# Exposes unsafe helpers for tests
test-utils = []
# Handle-based session layer consumed by the binding crates. Adds a global
# handle registry; not needed by pure-Rust callers.
session = ["dep:getrandom"]
# Additional intermediate logging useful for debugging and security information
tracing = ["dep:tracing"]

[dependencies]
libc = "0.2"
thiserror = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
sha2 = { workspace = true }

[package.metadata.docs.rs]
features = ["session"]

[lints]
workspace = true
