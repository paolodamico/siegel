name: CI

# Unless we are on the main branch, stop and yield to a new run if new code is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Format, Clippy & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD as of 2026-05-20 (https://github.com/dtolnay/rust-toolchain/tree/stable)
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # The CLI used here MUST match the boltffi version in the repo
      - name: Assert a single boltffi version resolves
        run: |
          # `cargo pkgid` requires a resolved graph
          cargo metadata --format-version 1 >/dev/null
          if ! cargo pkgid boltffi >/dev/null 2>&1; then
            echo "::error::cargo could not resolve a unique boltffi version" >&2
            cargo tree -p siegel-boltffi -i boltffi 2>&1 | head -20 >&2
            exit 1
          fi
          echo "resolved boltffi $(cargo pkgid boltffi | sed 's/.*[@#]//')"

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        rust:
          - stable
          - nightly
          - 1.85.0 # MSRV

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD as of 2026-05-20 (https://github.com/dtolnay/rust-toolchain/tree/stable)
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run tests
        run: |
          cargo test --workspace --all-features

      - name: Build with default features
        run: |
          cargo build --workspace

  bindings:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      # One binding breaking shouldn't hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - name: Test UniFFI Kotlin Bindings
            os: ubuntu-latest
            lang: kotlin
            binding: uniffi
          - name: Test BoltFFI Kotlin Bindings
            os: ubuntu-latest
            lang: kotlin
            binding: boltffi
          - name: Test UniFFI Swift Bindings
            os: macos-14
            lang: swift
            binding: uniffi
          - name: Test BoltFFI Swift Bindings
            os: macos-14
            lang: swift
            binding: boltffi

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false

      - name: Select Xcode 16.2
        if: matrix.lang == 'swift'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0 (https://github.com/maxim-lobanov/setup-xcode/releases/tag/v1.7.0)
        with:
          xcode-version: "16.2"

      - name: Set up JDK 17
        if: matrix.lang == 'kotlin'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0 (https://github.com/actions/setup-java/releases/tag/v4.8.0)
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD as of 2026-05-20 (https://github.com/dtolnay/rust-toolchain/tree/stable)
        with:
          toolchain: stable
          targets: ${{ matrix.lang == 'swift' && 'aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (https://github.com/Swatinem/rust-cache/releases/tag/v2.9.2)

      - name: Install boltffi CLI matching the resolved crate
        if: matrix.binding == 'boltffi'
        run: |
          cargo metadata --format-version 1 >/dev/null
          version="$(cargo pkgid boltffi | sed 's/.*[@#]//')"
          echo "installing boltffi_cli $version"
          cargo install boltffi_cli --version "$version" --locked

      - name: Build and run integration tests
        env:
          VERBOSE: 1
        run: ./${{ matrix.lang }}/test_${{ matrix.lang }}.sh ${{ matrix.binding }}

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources

    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18 (https://github.com/EmbarkStudios/cargo-deny-action/releases/tag/v2.0.18)
        with:
          command: check ${{ matrix.checks }}
          rust-version: 1.94

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD as of 2026-05-20 (https://github.com/dtolnay/rust-toolchain/tree/stable)
        with:
          toolchain: nightly
      - uses: dtolnay/install@982daea0f5d846abc3c83e01a6a1d73c040047c1 # cargo-docs-rs branch HEAD as of 2026-05-20 (https://github.com/dtolnay/install/tree/cargo-docs-rs)
      - run: |
          cargo +nightly docs-rs -p siegel
          cargo +nightly docs-rs -p siegel-uniffi
          cargo +nightly docs-rs -p siegel-boltffi
