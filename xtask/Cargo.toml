[package]
name = "xtask"
description = "Build and test automation for the Siegel foreign bindings."
publish = false

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# Deliberately omits `[lints] workspace = true`: the workspace denies
# `print_stdout`/`print_stderr`, and this crate's whole job is to print progress.
# `main.rs` denies clippy's `all`/`pedantic`/`nursery` groups instead.

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
sha2 = { workspace = true }
