[package]
name = "siegel-boltffi"
description = "BoltFFI bindings for Siegel. Enables sharing memory-protected secrets between foreign code and Rust."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "siegel_boltffi"
# boltffi requires staticlib for Apple; cdylib for Android
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Not for production use. Enables foreign tests.
test-utils = ["dep:sha2", "siegel/test-utils"]
# additional intermediate logging useful for debugging and security information
tracing = ["siegel/tracing"]
# Enables the JNI (Java Native Interface) fill path. Required on Android.
jvm = ["dep:jni"]

[dependencies]
siegel = { workspace = true, features = ["session"] }
thiserror = { workspace = true }
boltffi = "0.29"
sha2 = { workspace = true, optional = true }


[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
jni = { version = "0.22.4", optional = true }

[package.metadata.docs.rs]
# `jvm` is off by default, so without this the JNI fill path — the API the
# Kotlin docs tell consumers to call — is neither doc-checked under
# `RUSTDOCFLAGS: -Dwarnings` nor published.
features = ["jvm"]

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
