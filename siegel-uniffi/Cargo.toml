[package]
name = "siegel-uniffi"
description = "UniFFI bindings for Siegel. Enables sharing memory-protected secrets between foreign code and Rust."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "siegel_uniffi"
# `staticlib` + `cdylib` are required for iOS cross-compilation (integration tests)
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# Exposes `sha256_consume` to foreign bindings. Used by the Swift / Kotlin
# integration test suites to drive `read_once` end-to-end. Not for production use.
test_utils = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", optional = true }
siegel = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
