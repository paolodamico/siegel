[workspace]
members = ["siegel", "siegel-boltffi", "siegel-uniffi", "uniffi-bindgen"]
# Resolver 3 is MSRV-aware: with resolver 2 a fresh checkout selects icu_* 2.3
# (Rust 1.88) via boltffi -> url -> idna, which the 1.85 MSRV job cannot build.
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "0.3.0"
authors = [
    "Paolo D'Amico <5864173+paolodamico@users.noreply.github.com>",
]
repository = "https://github.com/paolodamico/siegel"

[workspace.dependencies]
uniffi = { version = "0.31.0", features = ["build"] }
thiserror = { version = "2" }
siegel = { version = "0.3.0", path = "siegel" }

[profile.release]
debug = false
lto = true
opt-level = "z"
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
