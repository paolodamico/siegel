[workspace]
members = ["siegel", "siegel-boltffi", "siegel-uniffi", "uniffi-bindgen", "xtask"]
# Resolver 3 is MSRV-aware, so `cargo update` keeps the lockfile buildable on
# 1.85 (resolver 2 picks e.g. icu_* 2.3 via boltffi -> url -> idna, needing 1.88).
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "0.3.0"
authors = [
    "Paolo D'Amico <5864173+paolodamico@users.noreply.github.com>",
]
repository = "https://github.com/paolodamico/siegel"

[workspace.dependencies]
# No default features: `cargo-metadata` and the bindgen pull Rust 1.86+ crates
# into every consumer. Only the `uniffi-bindgen` tool needs them.
uniffi = { version = "0.32", default-features = false }
thiserror = { version = "2" }
siegel = { version = "0.3.0", path = "siegel" }
sha2 = { version = "0.10" }

[profile.release]
debug = false
lto = true
opt-level = "z"
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
