[workspace]
members = ["siegel", "siegel-uniffi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = [
    "Paolo D'Amico <5864173+paolodamico@users.noreply.github.com>",
]
repository = "https://github.com/paolodamico/siegel"

[workspace.dependencies]
uniffi = { version = "0.31.0", features = ["build"] }
thiserror = { version = "2" }

[profile.release]
debug = false
lto = true
opt-level = "z"
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
